# Reloaded automatically each tick. Overflow resolves its organizational role at runtime.
version: 1
timezone: local
misfire_grace_seconds: 900
schedules:
  - id: overflow_daily_test
    enabled: true
    task: overflow
    recipient_role: office_supervisor
    timezone: Asia/Tehran
    trigger:
      type: cron
      hour: 9
      minute: 0
    params: {}
  - id: repairs_daily
    enabled: false
    task: repairs
    recipient: "654806764"
    trigger:
      type: cron
      hour: 8
      minute: 0
    params:
      section: mechanical
  - id: metalwork_daily
    enabled: false
    task: repairs
    recipient: "455740857"
    trigger:
      type: cron
      hour: 8
      minute: 0
    params:
      section: metalwork
  - id: driver_daily_office_supervisor
    enabled: true
    task: driver_daily
    recipient_role: office_supervisor
    timezone: Asia/Tehran
    trigger:
      type: cron
      hour: 10
      minute: 0
    params: {}

  - id: overflow_daily_mechanical
    enabled: true
    task: mechanical_overflow
    recipient_capability: reports.overflow.mechanical_daily_receive
    timezone: Asia/Tehran
    trigger:
      type: cron
      hour: 9
      minute: 0
    params: {}
  - id: driver_daily_mechanical
    enabled: true
    task: mechanical_driver_daily
    recipient_capability: reports.driver_daily.mechanical_daily_receive
    timezone: Asia/Tehran
    trigger:
      type: cron
      hour: 10
      minute: 0
    params: {}
