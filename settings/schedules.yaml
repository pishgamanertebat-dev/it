# Reloaded automatically each tick. Overflow resolves its organizational role at runtime.
version: 1
timezone: local
misfire_grace_seconds: 900
schedules:
  - id: overflow_daily_test
    enabled: true
    task: overflow
    recipient_capability: reports.overflow.daily_receive
    timezone: Asia/Tehran
    misfire:
      policy: replay
      horizon_days: 7
    trigger:
      type: cron
      hour: 9
      minute: 0
    params: {}
  - id: repairs_daily
    enabled: false
    task: repairs
    recipient: "654806764"
    trigger:
      type: cron
      hour: 8
      minute: 0
    params:
      section: mechanical
  - id: metalwork_daily
    enabled: false
    task: repairs
    recipient: "455740857"
    trigger:
      type: cron
      hour: 8
      minute: 0
    params:
      section: metalwork
  - id: driver_daily_office_supervisor
    enabled: true
    task: driver_daily
    recipient_capability: reports.driver_daily.daily_receive
    timezone: Asia/Tehran
    misfire:
      policy: replay
      horizon_days: 7
    trigger:
      type: cron
      hour: 10
      minute: 0
    params: {}

  - id: overflow_daily_mechanical
    enabled: true
    task: mechanical_overflow
    recipient_capability: reports.overflow.mechanical_daily_receive
    timezone: Asia/Tehran
    misfire:
      policy: replay
      horizon_days: 7
    trigger:
      type: cron
      hour: 9
      minute: 0
    params: {}
  - id: driver_daily_mechanical
    enabled: true
    task: mechanical_driver_daily
    recipient_capability: reports.driver_daily.mechanical_daily_receive
    timezone: Asia/Tehran
    misfire:
      policy: replay
      horizon_days: 7
    trigger:
      type: cron
      hour: 10
      minute: 0
    params: {}

  - id: driver_daily_metalwork
    enabled: true
    task: metalwork_driver_daily
    recipient_capability: reports.driver_daily.metalwork_daily_receive
    timezone: Asia/Tehran
    misfire:
      policy: replay
      horizon_days: 7
    trigger:
      type: cron
      hour: 9
      minute: 0
    params: {}

  - id: maintenance_daily_report
    enabled: true
    task: maintenance_daily_report
    recipient_capability: reports.maintenance.daily_receive
    timezone: Asia/Tehran
    misfire:
      policy: replay
      horizon_days: 7
    trigger:
      type: cron
      hour: 9
      minute: 0
    params: {}

external_misfire:
  - id: 3ccb658aed3c
    name: mine-file-sync
    policy: latest_only
